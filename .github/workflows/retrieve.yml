name: Retrieve New Drive Files

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# ------------------------------------------------------------
# All config lives here — never hardcode values in run steps.
#   vars.*    → non-credential repository variables
#   secrets.* → credentials (repository secrets)
# Steps reference these as "$NAME".
# ------------------------------------------------------------
env:
  # Non-credential (Settings → Secrets and variables → Actions → Variables)
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
  GEMINI_PERSONA: ${{ vars.GEMINI_PERSONA }}
  DRIVE_SPRITE_FOLDER_ID: ${{ vars.DRIVE_SPRITE_FOLDER_ID }}
  DRIVE_AUDIO_FOLDER_ID: ${{ vars.DRIVE_AUDIO_FOLDER_ID }}
  BOT_GIT_USERNAME: ${{ vars.BOT_GIT_USERNAME || 'Kozeki Ui' }}
  BOT_GIT_EMAIL: ${{ vars.BOT_GIT_EMAIL || '45u35+kozeki-ui[bot]@users.noreply.github.com' }}
  UNITY_PROJECT_PATH: ${{ vars.UNITY_PROJECT_PATH || '.' }}

  # Credentials (Settings → Secrets and variables → Actions → Secrets)
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  GH_TOKEN: ${{ secrets.PR_PAT || secrets.GITHUB_TOKEN }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  retrieve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      # Always start from the latest main
      - name: Sync latest main state & assets
        run: |
          git fetch origin main

          rm -rf state \
            Assets/_Game/02_Art/Sprite \
            Assets/_Game/03_Audio

          mkdir -p \
            state \
            Assets/_Game/02_Art/Sprite \
            Assets/_Game/03_Audio

          git archive origin/main -- state 2>/dev/null | tar -x || true
          git archive origin/main -- Assets/_Game/02_Art/Sprite 2>/dev/null | tar -x || true
          git archive origin/main -- Assets/_Game/03_Audio 2>/dev/null | tar -x || true

      - name: Retrieve new sprite files
        run: |
          python retrieve.py \
            --drive-folder-id "$DRIVE_SPRITE_FOLDER_ID" \
            --service-account-b64 "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" \
            --state-file "state/sprite_manifest.json" \
            --download-dir "Assets/_Game/02_Art/Sprite" \
            --project-name "$GITHUB_REPOSITORY (sprite)" \
            --discord-webhook "$DISCORD_WEBHOOK_URL"

      - name: Retrieve new audio files
        run: |
          python retrieve.py \
            --drive-folder-id "$DRIVE_AUDIO_FOLDER_ID" \
            --service-account-b64 "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" \
            --state-file "state/audio_manifest.json" \
            --download-dir "Assets/_Game/03_Audio" \
            --project-name "$GITHUB_REPOSITORY (audio)" \
            --discord-webhook "$DISCORD_WEBHOOK_URL"

      # Unity generates .meta files for the newly downloaded assets (stable GUIDs +
      # import settings) so they are committed together with the Drive files.
      - name: Setup Unity
        uses: buildalon/unity-setup@v2
        with:
          version-file: ${{ env.UNITY_PROJECT_PATH }}/ProjectSettings/ProjectVersion.txt

      - name: Activate Unity license
        uses: buildalon/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Generate .meta files (Unity import)
        shell: bash
        run: |
          set -e

          "$UNITY_EDITOR_PATH" \
            -batchmode -nographics -quit \
            -projectPath "$UNITY_PROJECT_PATH" \
            -logFile "$GITHUB_WORKSPACE/unity-import.log" || {
              echo "Unity import failed. Tail of log:"
              tail -200 "$GITHUB_WORKSPACE/unity-import.log" || true
              exit 1
            }

          # Should be no errors for our own content; surface any error CS lines.
          grep -n -E "error CS" "$GITHUB_WORKSPACE/unity-import.log" && {
            echo "Early compile errors detected."
            exit 1
          } || true

          echo "Unity import done. Generated .meta files:"
          git status --short Assets/_Game/02_Art/Sprite Assets/_Game/03_Audio \
            | grep '\.meta$' | head -50 || true

      # Persist retrieve bookkeeping (retrieve_status / downloaded_*) on main immediately.
      # Assets still go through chore/asset → PR; state alone must not wait on a merge
      # or the next run reloads empty/stale state from main and re-notifies.
      - name: Commit state to main
        id: state_commit
        run: |
          git config user.name "$BOT_GIT_USERNAME"
          git config user.email "$BOT_GIT_EMAIL"

          git fetch origin main
          git checkout -B main origin/main

          git add state/

          if git diff --cached --quiet; then
            echo "No state changes."
            echo "has_state=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(assets): update drive state [skip ci]"
          git push origin HEAD:main
          echo "has_state=true" >> "$GITHUB_OUTPUT"

      - name: Commit retrieved files to chore/asset
        id: commit
        run: |
          git config user.name "$BOT_GIT_USERNAME"
          git config user.email "$BOT_GIT_EMAIL"

          # Rebuild chore/asset from main so it includes the state commit above.
          git fetch origin main

          WORKTREE=/tmp/chore-asset

          # Always recreate chore/asset from latest main.
          # This avoids inheriting the broken branch history/state.
          git branch -D chore/asset 2>/dev/null || true
          git push origin --delete chore/asset 2>/dev/null || true

          git worktree add -b chore/asset "$WORKTREE" origin/main

          mkdir -p \
            "$WORKTREE/Assets/_Game/02_Art/Sprite" \
            "$WORKTREE/Assets/_Game/03_Audio"

          cp -rf Assets/_Game/02_Art/Sprite/. \
            "$WORKTREE/Assets/_Game/02_Art/Sprite/" 2>/dev/null || true

          cp -rf Assets/_Game/03_Audio/. \
            "$WORKTREE/Assets/_Game/03_Audio/" 2>/dev/null || true

          cd "$WORKTREE"

          git add \
            Assets/_Game/02_Art/Sprite \
            Assets/_Game/03_Audio

          if git diff --cached --quiet; then
            echo "No asset changes, skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(assets): retrieve new drive files [skip ci]"
          git push origin HEAD:chore/asset

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          cd /tmp/chore-asset

          TITLE="chore(assets): retrieve new drive files"
          BODY="Automated asset sync from Google Drive.

          Last updated: $(date -u +'%Y-%m-%d %H:%M UTC')"

          OPEN_PR=$(gh pr list \
            --head chore/asset \
            --state open \
            --repo "$GITHUB_REPOSITORY" \
            --json number \
            --jq '.[0].number')

          if [ -n "$OPEN_PR" ]; then
            echo "Open PR #$OPEN_PR already exists, updating it."
            gh pr edit "$OPEN_PR" \
              --title "$TITLE" \
              --body "$BODY" \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "No open PR found, creating a new one."
            gh pr create \
              --base main \
              --head chore/asset \
              --title "$TITLE" \
              --body "$BODY" \
              --repo "$GITHUB_REPOSITORY"
          fi


  # ============================================================
  # DISCORD FAILURE NOTIFICATION
  # ============================================================

  notify-failure:
    name: Notify Discord (Failure)

    needs:
      - retrieve

    if: failure()

    runs-on: ubuntu-latest

    steps:

      - name: Generate failure message with Gemini
        id: flavor

        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        shell: bash

        run: |
          set -e

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "${GEMINI_LANGUAGE}" ]; then
            LANGUAGE_INSTRUCTION="Write the response in ${GEMINI_LANGUAGE}."
          else
            LANGUAGE_INSTRUCTION="Write the response in the same language used in the persona instructions above."
          fi

          PROMPT="${GEMINI_PERSONA}

          Write ONE short paragraph (maximum 3 sentences, no markdown formatting, no surrounding quotation marks) announcing that the automated Drive file retrieval workflow for repository \"${{ github.repository }}\" has FAILED.

          Include the workflow run URL: ${RUN_URL}
          ${LANGUAGE_INSTRUCTION}"

          BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            '{
              contents: [
                {
                  parts: [
                    {
                      text: $prompt
                    }
                  ]
                }
              ]
            }')

          RESPONSE=$(curl -sS -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          TEXT=$(echo "$RESPONSE" | jq -r \
            '.candidates[0].content.parts[0].text // empty')

          if [ -z "$TEXT" ]; then
            echo "Gemini failed, using fallback message."
            TEXT="Retrieve drive files untuk ${{ github.repository }} gagal. Sila cek log: ${RUN_URL}"
          fi

          {
            echo "text<<GEMINI_EOF"
            echo "$TEXT"
            echo "GEMINI_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord failure notification

        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FLAVOR_TEXT: ${{ steps.flavor.outputs.text }}

        shell: bash

        run: |
          set -e

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(jq -n \
            --arg content "$FLAVOR_TEXT" \
            --arg title "Retrieve Failed — ${{ github.repository }}" \
            --arg url "$RUN_URL" \
            '{
              embeds: [
                {
                  title: $title,
                  url: $url,
                  description: $content,
                  color: 15548997
                }
              ]
            }')

          curl -sS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
